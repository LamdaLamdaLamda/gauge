# cargo-deny configuration — run with `cargo deny check` (see the justfile).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# gauge only supports Unix; don't fail on Windows-only crates in the graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

########################################
# LICENSES
########################################
[licenses]
# Permissive licenses common in the Rust ecosystem. Anything else — in
# particular copyleft — has to be added here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.8

########################################
# BANS (dependency control)
########################################
[bans]
multiple-versions = "warn"
wildcards = "deny"

########################################
# SOURCES (supply chain integrity)
########################################
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

########################################
# ADVISORIES (known vulnerabilities)
########################################
[advisories]
yanked = "warn"
