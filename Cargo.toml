[package]
name = "gauge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "An iperf-style network throughput tester with a terminal UI: TCP, UDP and QUIC, real loss/jitter/retransmit measurements"
readme = "README.md"
keywords = ["network", "throughput", "benchmark", "iperf", "tui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
libc = "0.2.189"
quinn = "0.11.12"
ratatui = "0.30.2"
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
toml = "1.1.4"

[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"
